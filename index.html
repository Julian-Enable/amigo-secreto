<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Secreto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }
  .container {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px;
    max-width: 600px;
    width: 95%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #e94560, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #aaa; margin-bottom: 24px; font-size: 0.9em; }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 1.1em;
    font-weight: 600;
    margin-bottom: 10px;
    color: #f5a623;
    border-bottom: 1px solid rgba(245,166,35,0.3);
    padding-bottom: 6px;
  }
  .add-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-row input { flex: 1; }
  input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 1em;
    outline: none;
    transition: border 0.3s;
  }
  input[type="text"]:focus { border-color: #e94560; }
  select {
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 0.9em;
    outline: none;
    margin-left: 8px;
  }
  select option { background: #1a1a2e; color: #fff; }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9em;
    font-weight: 600;
    transition: all 0.3s;
  }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #c73850; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  .btn-success { background: #2ecc71; color: #fff; }
  .btn-success:hover { background: #27ae60; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .person-list { list-style: none; margin-top: 8px; }
  .person-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 0.9em;
  }
  .person-list li .remove {
    background: #e94560;
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 0.8em;
  }
  .badge-mujer { background: #e91e63; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .badge-hombre { background: #2196f3; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .badge-exception { background: #f5a623; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; color: #000; }
  .result-box {
    margin-top: 20px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 24px;
    display: none;
  }
  .result-box.active { display: block; }
  .result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    margin-bottom: 6px;
    transition: background 0.3s;
  }
  .result-item:hover { background: rgba(255,255,255,0.1); }
  .exception { color: #f5a623; font-size: 0.8em; font-weight: 600; }
  .stats {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
    padding: 12px 20px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
  }
  .stat .num { font-size: 1.8em; font-weight: 700; color: #f5a623; }
  .stat .label { font-size: 0.75em; color: #aaa; }
  .warning {
    background: rgba(245,166,35,0.15);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 0.85em;
    color: #f5a623;
    display: none;
  }
  .warning.active { display: block; }
  .reveal-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    font-size: 1.1em;
    background: linear-gradient(135deg, #e94560, #f5a623);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    transition: transform 0.2s;
  }
  .reveal-btn:hover { transform: scale(1.02); }
  .hidden-names { filter: blur(8px); user-select: none; transition: all 0.5s; }
  .hidden-names.revealed { filter: none; user-select: auto; }
  @media (max-width: 480px) {
    .container { padding: 24px; }
    h1 { font-size: 1.5em; }
    .add-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎁 Amigo Secreto</h1>
  <p class="subtitle">Sin emparejar mismo género (mínimo excepciones)</p>

  <div class="warning" id="warning"></div>

  <div class="section">
    <div class="section-title">Agregar Participantes</div>
    <div class="add-row">
      <input type="text" id="nombreInput" placeholder="Nombre del participante">
      <select id="generoSelect">
        <option value="hombre">👨 Hombre</option>
        <option value="mujer">👩 Mujer</option>
      </select>
      <button class="btn btn-primary" onclick="agregarPersona()">Agregar</button>
    </div>
    <div style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">
      <div class="section-title" style="border:none; padding:0; margin-bottom:6px">O pegar lista completa</div>
      <textarea id="listaInput" placeholder="Ej: Juan (h), María (m), Pedro (h), Ana (m)&#10;Formato: Nombre (h o m)" style="width:100%; padding:10px 14px; border:1px solid rgba(255,255,255,0.15); border-radius:10px; background:rgba(255,255,255,0.07); color:#fff; font-size:0.9em; outline:none; resize:vertical; min-height:60px; font-family:inherit;"></textarea>
      <button class="btn btn-primary" onclick="importarLista()" style="margin-top:8px">📋 Importar Lista</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Participantes (<span id="totalCount">0</span>)</div>
    <ul class="person-list" id="personList"></ul>
  </div>

  <div class="actions">
    <button class="btn btn-success" onclick="generarSorteo()" id="btnGenerar" style="flex:1">🎲 Generar Sorteo</button>
    <button class="btn btn-secondary" onclick="limpiarTodo()" style="flex:1">🗑️ Limpiar Todo</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="section-title">📋 Resultado del Sorteo</div>
    <div id="resultList"></div>
    <div class="stats" id="stats"></div>
    <button class="reveal-btn" onclick="revelarNombres()" id="revealBtn">🔍 Revelar Nombres</button>
  </div>
</div>

<script>
let personas = [];
let sorteoAsignacion = [];
let nombresRevelados = false;

function agregarPersona() {
  const nombre = document.getElementById('nombreInput').value.trim();
  const genero = document.getElementById('generoSelect').value;
  if (!nombre) { alert('Ingresa un nombre'); return; }
  if (personas.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
    alert('Este nombre ya existe'); return;
  }
  personas.push({ nombre, genero });
  document.getElementById('nombreInput').value = '';
  document.getElementById('nombreInput').focus();
  renderPersonas();
}

function removerPersona(i) {
  personas.splice(i, 1);
  renderPersonas();
  document.getElementById('resultBox').classList.remove('active');
}

function renderPersonas() {
  const list = document.getElementById('personList');
  document.getElementById('totalCount').textContent = personas.length;
  const H = personas.filter(p => p.genero === 'hombre').length;
  const M = personas.filter(p => p.genero === 'mujer').length;
  const diff = Math.abs(H - M);
  const warn = document.getElementById('warning');
  if (diff > 4 && H > 0 && M > 0) {
    warn.textContent = `⚠️ Hay ${diff} persona(s) de diferencia. Se generarán ${diff} excepciones mínimas de mismo género.`;
    warn.classList.add('active');
  } else {
    warn.classList.remove('active');
  }
  list.innerHTML = personas.map((p, i) => `
    <li>
      <span>${p.nombre} <span class="badge-${p.genero}">${p.genero}</span></span>
      <button class="remove" onclick="removerPersona(${i})">✕</button>
    </li>
  `).join('');
  nombresRevelados = false;
  document.getElementById('resultBox').classList.remove('active');
}

function generateDerangement(n) {
  for (let attempt = 0; attempt < 1000; attempt++) {
    const perm = Array.from({length: n}, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    let ok = true;
    for (let i = 0; i < n; i++) {
      if (perm[i] === i) { ok = false; break; }
    }
    if (ok) return perm;
  }
  return null;
}

function generateAssignment(personas) {
  const n = personas.length;
  const hombres = personas.filter(p => p.genero === 'hombre');
  const mujeres = personas.filter(p => p.genero === 'mujer');
  const H = hombres.length, M = mujeres.length;
  const minExcep = Math.abs(H - M);

  let bestPerm = null;
  let bestExc = Infinity;

  for (let attempt = 0; attempt < 30000; attempt++) {
    const perm = generateDerangement(n);
    if (!perm) continue;
    let exc = 0;
    for (let i = 0; i < n; i++) {
      if (personas[i].genero === personas[perm[i]].genero) exc++;
    }
    if (exc < bestExc) {
      bestExc = exc;
      bestPerm = perm;
    }
    if (exc === minExcep) break;
  }

  return bestPerm.map((target, i) => ({
    giver: personas[i],
    receiver: personas[target]
  }));
}

function generarSorteo() {
  if (personas.length < 3) { alert('Se necesitan al menos 3 personas'); return; }
  if (personas.length < 2) return;

  const H = personas.filter(p => p.genero === 'hombre').length;
  const M = personas.filter(p => p.genero === 'mujer').length;

  if (H === 0 || M === 0) {
    alert('Se necesitan al menos 1 hombre y 1 mujer para el sorteo.');
    return;
  }

  const minExcep = Math.abs(H - M);
  if (minExcep > 4) {
    if (!confirm(`Hay ${minExcep} persona(s) de diferencia entre géneros. Se permitirán ${minExcep} excepciones mínimas de mismo género. ¿Continuar?`)) return;
  }

  sorteoAsignacion = generateAssignment(personas);
  const exceptions = sorteoAsignacion.filter(a => a.giver.genero === a.receiver.genero).length;
  nombresRevelados = false;
  renderResultado(exceptions, minExcep);
}

function renderResultado(exceptions, minExcep) {
  const box = document.getElementById('resultBox');
  const list = document.getElementById('resultList');
  const stats = document.getElementById('stats');

  list.innerHTML = sorteoAsignacion.map((a, i) => {
    const isException = a.giver.genero === a.receiver.genero;
    return `
      <div class="result-item">
        <span>
          ${a.giver.nombre} <span class="badge-${a.giver.genero}">${a.giver.genero}</span>
          ${isException ? '<span class="badge-exception">⚠️ Excepción</span>' : ''}
        </span>
        <span class="hidden-names" id="receiver-${i}">
          → <strong>${a.receiver.nombre}</strong> <span class="badge-${a.receiver.genero}">${a.receiver.genero}</span>
        </span>
      </div>
    `;
  }).join('');

  const crossGender = sorteoAsignacion.length - exceptions;
  stats.innerHTML = `
    <div class="stat">
      <div class="num">${crossGender}</div>
      <div class="label">Cross-gender ✅</div>
    </div>
    <div class="stat">
      <div class="num">${exceptions}</div>
      <div class="label">Excepciones ⚠️</div>
    </div>
    <div class="stat">
      <div class="num">${personas.length}</div>
      <div class="label">Participantes</div>
    </div>
  `;

  box.classList.add('active');
  nombresRevelados = false;
  document.getElementById('revealBtn').textContent = '🔍 Revelar Nombres';
}

function revelarNombres() {
  nombresRevelados = !nombresRevelados;
  const btn = document.getElementById('revealBtn');
  document.querySelectorAll('.hidden-names').forEach(el => {
    if (nombresRevelados) el.classList.add('revealed');
    else el.classList.remove('revealed');
  });
  btn.textContent = nombresRevelados ? '🙈 Ocultar Nombres' : '🔍 Revelar Nombres';
}

function limpiarTodo() {
  personas = [];
  sorteoAsignacion = [];
  nombresRevelados = false;
  document.getElementById('personList').innerHTML = '';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('resultBox').classList.remove('active');
  document.getElementById('warning').classList.remove('active');
  document.getElementById('nombreInput').focus();
}

function importarLista() {
  const texto = document.getElementById('listaInput').value.trim();
  if (!texto) { alert('Pega la lista primero'); return; }
  const lines = texto.split(/[,\n]/);
  let added = 0;
  lines.forEach(item => {
    const trimmed = item.trim();
    if (!trimmed) return;
    const match = trimmed.match(/^(.+?)\s*\(\s*(h|m|hombre|mujer)\s*\)$/i);
    if (match) {
      const nombre = match[1].trim();
      const gen = match[2].toLowerCase();
      const g = gen === 'm' || gen === 'mujer' ? 'mujer' : 'hombre';
      if (nombre && !personas.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
        personas.push({ nombre, genero: g });
        added++;
      }
    } else {
      const nombre = trimmed.replace(/[()]/g, '').trim();
      if (nombre && !personas.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
        personas.push({ nombre, genero: 'hombre' });
        added++;
      }
    }
  });
  if (added > 0) {
    renderPersonas();
    alert(`Se agregaron ${added} persona(s)`);
  } else {
    alert('No se encontraron nombres válidos. Usa formato: Nombre (h) o Nombre (m)');
  }
  document.getElementById('listaInput').value = '';
}

document.getElementById('nombreInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') agregarPersona();
});
</script>
</body>
</html>
