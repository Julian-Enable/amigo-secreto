<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfa">
<meta name="description" content="Elige tu nombre y descubre a quién le das el regalo.">
<title>Amigo Secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #fcfcfa;
    --surface: #ffffff;
    --line: #e6e5e0;
    --line-strong: #cfcdc6;
    --ink: #17181a;
    --ink-soft: #6f7278;
    --ink-faint: #a3a29d;
    --accent: #b8354f;
    --accent-deep: #96263d;
    --accent-wash: #fbeef1;
    --done: #4f7a5e;
    --radius: 13px;
    --shadow: 0 1px 2px rgba(23,24,26,0.04), 0 10px 30px -18px rgba(23,24,26,0.28);
    --display: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--sans);
    background: var(--ground);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 20px calc(50px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 600px; }

  /* ---------- encabezado ---------- */
  header { text-align: center; margin-bottom: 34px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-wash);
    padding: 6px 13px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: var(--display);
    font-size: clamp(2.6rem, 9vw, 3.9rem);
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1;
    text-wrap: balance;
  }

  .sub {
    color: var(--ink-soft);
    margin-top: 12px;
    font-size: 1rem;
    text-wrap: balance;
  }

  /* ---------- progreso ---------- */
  .progress { margin-top: 26px; }

  .track {
    height: 4px;
    background: var(--line);
    border-radius: 100px;
    overflow: hidden;
  }

  .track span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 100px;
    transition: width 0.65s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress p {
    font-size: 0.83rem;
    color: var(--ink-faint);
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- vistas ---------- */
  .view { display: none; animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
  .view.on { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- buscador ---------- */
  .search { position: relative; margin-bottom: 15px; display: none; }
  .search.on { display: block; }

  .search input {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 13px 16px 13px 43px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }

  .search svg {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    pointer-events: none;
  }

  /* ---------- lista ---------- */
  .names {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 9px;
  }

  .name {
    font: inherit;
    font-size: 0.98rem;
    font-weight: 500;
    text-align: left;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.18s, transform 0.18s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: var(--shadow);
  }

  .name:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
  .name:active:not(:disabled) { transform: translateY(0); }
  .name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .name:disabled {
    cursor: default;
    background: transparent;
    box-shadow: none;
    border-style: dashed;
    color: var(--ink-faint);
  }

  .name:disabled .label { text-decoration: line-through; }
  .name .check { color: var(--done); flex-shrink: 0; }

  .empty {
    text-align: center;
    color: var(--ink-faint);
    padding: 34px 0;
    font-size: 0.93rem;
  }

  /* ---------- tarjeta ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 26px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .ask { font-size: 0.93rem; color: var(--ink-soft); }

  .who {
    font-family: var(--display);
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 12px 0 30px;
    text-wrap: balance;
  }

  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .btn {
    font: inherit;
    font-size: 0.96rem;
    font-weight: 550;
    padding: 13px 25px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.15s;
  }

  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-main { background: var(--accent); color: #fff; }
  .btn-main:hover { background: var(--accent-deep); }
  .btn-main:disabled { opacity: 0.6; cursor: wait; }

  .btn-quiet { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn-quiet:hover { border-color: var(--ink-faint); }

  /* ---------- revelación ---------- */
  .ribbon { display: flex; justify-content: center; }
  .ribbon svg { color: var(--accent); }
  .ribbon.play svg { animation: pop 0.85s cubic-bezier(0.16, 1, 0.3, 1); }

  @keyframes pop {
    0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
    55% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  .kicker {
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 24px 0 10px;
  }

  .receiver {
    font-family: var(--display);
    font-size: clamp(2.4rem, 10vw, 3.7rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.05;
    color: var(--accent);
    text-wrap: balance;
    animation: unblur 0.85s 0.22s backwards cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes unblur {
    from { opacity: 0; filter: blur(12px); transform: translateY(8px); }
    to { opacity: 1; filter: blur(0); transform: none; }
  }

  .note {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 0.87rem;
    color: var(--ink-soft);
    text-wrap: balance;
  }

  /* ---------- avisos ---------- */
  .alert {
    border-radius: var(--radius);
    padding: 15px 17px;
    font-size: 0.91rem;
    margin-bottom: 16px;
    display: none;
    text-wrap: balance;
    background: var(--accent-wash);
    color: var(--accent-deep);
  }
  .alert.on { display: block; }

  .loading {
    text-align: center;
    color: var(--ink-faint);
    padding: 52px 0;
  }

  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    margin: 0 2px;
    animation: beat 1.3s infinite ease-in-out both;
  }
  .dot:nth-child(2) { animation-delay: 0.16s; }
  .dot:nth-child(3) { animation-delay: 0.32s; }

  @keyframes beat {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  footer {
    margin-top: 38px;
    text-align: center;
    font-size: 0.79rem;
    color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 7h-1.6A3.5 3.5 0 0 0 12 3.9 3.5 3.5 0 0 0 5.6 7H4a1 1 0 0 0-1 1v3h9V7h-1.5a1.5 1.5 0 1 1 1.5-1.5V7h1V5.5A1.5 1.5 0 1 1 14.5 7H13v4h9V8a1 1 0 0 0-1-1Z"/><path d="M4 13v7a1 1 0 0 0 1 1h6v-8H4Zm9 8h6a1 1 0 0 0 1-1v-7h-7v8Z"/></svg>
      Sorteo cerrado
    </div>
    <h1>Amigo Secreto</h1>
    <p class="sub" id="sub">Busca tu nombre y descubre a quién le das el regalo.</p>

    <div class="progress" id="progress" hidden>
      <div class="track"><span id="bar"></span></div>
      <p id="count"></p>
    </div>
  </header>

  <div class="alert" id="alert" role="alert"></div>

  <div class="view on" id="viewLoading">
    <div class="loading">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>

  <div class="view" id="viewList">
    <div class="search" id="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="filter" placeholder="Busca tu nombre" autocomplete="off" aria-label="Buscar tu nombre">
    </div>
    <div class="names" id="names"></div>
    <p class="empty" id="noMatch" hidden>Ningún nombre coincide con esa búsqueda.</p>
  </div>

  <div class="view" id="viewConfirm">
    <div class="card">
      <p class="ask">Vas a ver tu amigo secreto. ¿Eres tú?</p>
      <p class="who" id="confirmName"></p>
      <div class="row">
        <button class="btn btn-quiet" id="back">No, volver</button>
        <button class="btn btn-main" id="confirm">Sí, soy yo</button>
      </div>
      <p class="note">Solo puedes abrirlo una vez: al confirmar, tu nombre queda marcado.</p>
    </div>
  </div>

  <div class="view" id="viewResult">
    <div class="card">
      <div class="ribbon" id="ribbon" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-1.6A3.5 3.5 0 0 0 12 3.9 3.5 3.5 0 0 0 5.6 7H4a1 1 0 0 0-1 1v3h9V7h-1.5a1.5 1.5 0 1 1 1.5-1.5V7h1V5.5A1.5 1.5 0 1 1 14.5 7H13v4h9V8a1 1 0 0 0-1-1Z"/><path d="M4 13v7a1 1 0 0 0 1 1h6v-8H4Zm9 8h6a1 1 0 0 0 1-1v-7h-7v8Z"/></svg>
      </div>
      <p class="kicker">Le das el regalo a</p>
      <p class="receiver" id="receiver" aria-live="polite"></p>
      <p class="note" id="resultNote"></p>
      <div class="row" style="margin-top:22px;">
        <button class="btn btn-quiet" id="done">Listo</button>
      </div>
    </div>
  </div>

</div>

<footer>Nadie más puede ver tu resultado.</footer>

<script>
'use strict';

const CLAVE_LOCAL = 'amigoSecreto.miResultado';

const views = {
  loading: document.getElementById('viewLoading'),
  list: document.getElementById('viewList'),
  confirm: document.getElementById('viewConfirm'),
  result: document.getElementById('viewResult'),
};

const alerta = document.getElementById('alert');
const contenedor = document.getElementById('names');
const noMatch = document.getElementById('noMatch');
const search = document.getElementById('search');
const filter = document.getElementById('filter');
const progress = document.getElementById('progress');
const bar = document.getElementById('bar');
const count = document.getElementById('count');

let personas = [];
let elegido = null;

function show(nombre) {
  Object.values(views).forEach((v) => v.classList.remove('on'));
  views[nombre].classList.add('on');
}

function error(mensaje) {
  alerta.textContent = mensaje;
  alerta.classList.add('on');
}

function limpiarError() {
  alerta.classList.remove('on');
}

/* ---------- memoria del propio dispositivo ---------- */
// La marca global vive en la base de datos; esto es solo una copia local para
// que nadie pierda su asignacion por cerrar la pagina sin querer.
function guardarLocal(nombre, daA) {
  try {
    localStorage.setItem(CLAVE_LOCAL, JSON.stringify({ nombre, daA }));
  } catch (e) { /* modo privado */ }
}

function leerLocal() {
  try {
    return JSON.parse(localStorage.getItem(CLAVE_LOCAL) || 'null');
  } catch (e) {
    return null;
  }
}

/* ---------- pintar ---------- */
function actualizarProgreso() {
  const vistos = personas.filter((p) => p.revelado).length;
  const total = personas.length;
  progress.hidden = false;
  bar.style.width = total ? (vistos / total) * 100 + '%' : '0%';
  count.textContent =
    vistos === 0
      ? 'Nadie ha abierto el suyo todavía · ' + total + ' participantes'
      : vistos === total
        ? 'Listo: los ' + total + ' ya vieron su amigo secreto'
        : vistos + ' de ' + total + ' ya vieron su amigo secreto';
}

function pintarLista() {
  const texto = filter.value.trim().toLowerCase();
  const visibles = personas.filter((p) => !texto || p.nombre.toLowerCase().includes(texto));

  contenedor.innerHTML = '';
  visibles.forEach((p) => {
    const btn = document.createElement('button');
    btn.className = 'name';
    btn.type = 'button';
    btn.disabled = p.revelado;

    const span = document.createElement('span');
    span.className = 'label';
    span.textContent = p.nombre;
    btn.appendChild(span);

    if (p.revelado) {
      btn.setAttribute('aria-label', p.nombre + ', ya abrió el suyo');
      btn.insertAdjacentHTML('beforeend',
        '<svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>');
    } else {
      btn.addEventListener('click', () => confirmar(p.nombre));
    }

    contenedor.appendChild(btn);
  });

  noMatch.hidden = visibles.length > 0;
}

/* ---------- flujo ---------- */
function confirmar(nombre) {
  limpiarError();
  elegido = nombre;
  document.getElementById('confirmName').textContent = nombre;
  show('confirm');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function verResultado(daA, yaVisto) {
  document.getElementById('receiver').textContent = daA;
  document.getElementById('resultNote').textContent = yaVisto
    ? 'Ya habías abierto el tuyo. Este es el mismo resultado de siempre.'
    : 'Guarda una captura. Este es tu único turno: tu nombre ya quedó marcado para los demás.';
  const ribbon = document.getElementById('ribbon');
  ribbon.classList.remove('play');
  void ribbon.offsetWidth;
  ribbon.classList.add('play');
  show('result');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function cargarEstado() {
  const res = await fetch('/api/estado', { cache: 'no-store' });
  if (!res.ok) throw new Error('estado');
  const datos = await res.json();
  personas = datos.personas;
  actualizarProgreso();
  search.classList.toggle('on', personas.length > 12);
  pintarLista();
}

document.getElementById('back').addEventListener('click', () => {
  elegido = null;
  show('list');
});

document.getElementById('confirm').addEventListener('click', async function () {
  if (!elegido) return;
  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Abriendo…';
  limpiarError();

  try {
    const res = await fetch('/api/revelar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: elegido }),
    });
    const datos = await res.json();

    if (res.ok) {
      guardarLocal(elegido, datos.daA);
      const persona = personas.find((p) => p.nombre === elegido);
      if (persona) persona.revelado = true;
      actualizarProgreso();
      pintarLista();
      verResultado(datos.daA, false);
    } else if (datos.error === 'ya_revelado') {
      const local = leerLocal();
      if (local && local.nombre === elegido) {
        verResultado(local.daA, true);
      } else {
        error('Ese nombre ya fue abierto desde otro dispositivo. Si no fuiste tú, avísale al organizador.');
        await cargarEstado();
        show('list');
      }
    } else {
      error('No se pudo abrir tu amigo secreto. Revisa tu conexión e inténtalo de nuevo.');
      show('list');
    }
  } catch (e) {
    error('No hay conexión con el servidor. Inténtalo de nuevo en un momento.');
    show('list');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sí, soy yo';
  }
});

document.getElementById('done').addEventListener('click', () => {
  elegido = null;
  show('list');
});

filter.addEventListener('input', pintarLista);

(async function iniciar() {
  try {
    await cargarEstado();
    const local = leerLocal();
    if (local && personas.some((p) => p.nombre === local.nombre && p.revelado)) {
      document.getElementById('sub').textContent = 'Ya abriste el tuyo. Aquí está de nuevo.';
      verResultado(local.daA, true);
    } else {
      show('list');
    }
  } catch (e) {
    error('No se pudo cargar la lista de participantes. Recarga la página.');
    show('list');
  }
})();
</script>
</body>
</html>
