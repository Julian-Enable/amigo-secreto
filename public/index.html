<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Amigo Secreto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }
  .container {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px;
    max-width: 650px;
    width: 95%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 { text-align: center; font-size: 2em; margin-bottom: 8px; background: linear-gradient(90deg, #e94560, #f5a623); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #aaa; margin-bottom: 24px; font-size: 0.9em; }
  .section { margin-bottom: 20px; }
  .section-title { font-size: 1.1em; font-weight: 600; margin-bottom: 10px; color: #f5a623; border-bottom: 1px solid rgba(245,166,35,0.3); padding-bottom: 6px; }
  .add-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .add-row input, .add-row select { flex: 1; min-width: 120px; }
  input[type="text"], textarea {
    width: 100%; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; background: rgba(255,255,255,0.07); color: #fff;
    font-size: 1em; outline: none; transition: border 0.3s; font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { border-color: #e94560; }
  select { padding: 10px 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; background: rgba(255,255,255,0.07); color: #fff; font-size: 0.9em; outline: none; }
  select option { background: #1a1a2e; color: #fff; }
  .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all 0.3s; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #c73850; }
  .btn-success { background: #2ecc71; color: #fff; }
  .btn-success:hover { background: #27ae60; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .person-list { list-style: none; margin-top: 8px; }
  .person-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 4px; font-size: 0.9em; }
  .person-list li .remove { background: #e94560; border: none; color: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 0.8em; }
  .badge-mujer { background: #e91e63; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .badge-hombre { background: #2196f3; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .badge-exception { background: #f5a623; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; color: #000; }
  .result-box { margin-top: 20px; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; display: none; }
  .result-box.active { display: block; }
  .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 6px; }
  .exception { color: #f5a623; font-size: 0.8em; font-weight: 600; }
  .stats { display: flex; gap: 16px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
  .stat { text-align: center; padding: 12px 20px; background: rgba(255,255,255,0.06); border-radius: 12px; }
  .stat .num { font-size: 1.8em; font-weight: 700; color: #f5a623; }
  .stat .label { font-size: 0.75em; color: #aaa; }
  .warning { background: rgba(245,166,35,0.15); border: 1px solid rgba(245,166,35,0.3); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 0.85em; color: #f5a623; display: none; }
  .warning.active { display: block; }
  .reveal-btn { display: block; width: 100%; padding: 14px; margin-top: 16px; font-size: 1.1em; background: linear-gradient(135deg, #e94560, #f5a623); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; transition: transform 0.2s; }
  .reveal-btn:hover { transform: scale(1.02); }
  .hidden-names { filter: blur(8px); user-select: none; transition: all 0.5s; }
  .hidden-names.revealed { filter: none; user-select: auto; }
  .link-box { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); border-radius: 10px; padding: 16px; margin-top: 16px; text-align: center; }
  .link-box a { color: #2ecc71; font-size: 1.1em; font-weight: 700; word-break: break-all; }
  .secret-box { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; text-align: center; margin-top: 20px; }
  .secret-box .gift-icon { font-size: 4em; }
  .secret-box .receiver-name { font-size: 1.5em; font-weight: 700; color: #f5a623; margin-top: 10px; }
  .admin-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #aaa; padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8em; margin-left: 10px; }
  .admin-toggle.active { background: #f5a623; color: #000; }
  .tab-view { display: none; }
  .tab-view.active { display: block; }
  .step { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .step .step-num { display: inline-block; background: #f5a623; color: #000; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px; font-weight: 700; margin-right: 10px; font-size: 0.9em; }
  @media (max-width: 480px) { .container { padding: 24px; } h1 { font-size: 1.5em; } .add-row { flex-direction: column; } }
</style>
</head>
<body>
<div class="container">
  <h1>🎁 Amigo Secreto</h1>
  <p class="subtitle">Cada persona entra y solo ve a quién le toca dar</p>

  <div id="setupMode">
    <div class="step">
      <span class="step-num">1</span> Ingresa todos los participantes
    </div>
    <div class="section">
      <div class="add-row">
        <input type="text" id="nombreInput" placeholder="Nombre completo">
        <select id="generoSelect">
          <option value="hombre">👨 Hombre</option>
          <option value="mujer">👩 Mujer</option>
        </select>
        <button class="btn btn-primary" onclick="agregarPersona()">Agregar</button>
      </div>
      <div style="margin-top:8px;">
        <textarea id="listaInput" placeholder="Opegar lista: Juan (h), María (m)..." style="min-height:60px;"></textarea>
        <button class="btn btn-primary" onclick="importarLista()" style="margin-top:8px;">📋 Importar Lista</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Participantes (<span id="totalCount">0</span>)</div>
      <ul class="person-list" id="personList"></ul>
      <div class="warning" id="warning"></div>
    </div>
    <div class="actions">
      <button class="btn btn-success" onclick="generarSorteo()" id="btnGenerar" style="flex:1">🎲 Generar Sorteo</button>
      <button class="btn btn-secondary" onclick="limpiarTodo()" style="flex:1">🗑️ Limpiar</button>
    </div>
  </div>

  <div id="shareMode" class="tab-view">
    <div class="section">
      <div class="section-title">📤 Compartir con tu equipo</div>
      <div class="link-box">
        <p style="margin-bottom:8px;">Envía este link a todos los participantes:</p>
        <a id="shareLink" href="#" target="_blank"></a>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <button class="btn btn-primary" onclick="copiarLink()" style="flex:1">📋 Copiar Link</button>
      </div>
    </div>
    <div class="step" style="margin-top:16px;">
      <span class="step-num">2</span> Cada persona entra, pone su nombre y ve a quién le da el regalo
    </div>
    <div id="revealSection" style="text-align:center;">
      <input type="text" id="revealInput" placeholder="Escribe tu nombre completo..." style="max-width:400px;margin:0 auto;">
      <button class="btn btn-success" onclick="revelar()" style="margin-top:12px;">🔍 Ver mi asignación</button>
      <div id="revealResult"></div>
    </div>
    <div id="listSection" style="margin-top:20px;">
      <button class="btn btn-secondary" onclick="toggleAdminView()" style="width:100%;margin-bottom:12px;">👁️ Ver lista completa (Admin)</button>
      <div id="adminView" class="tab-view" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<script>
let personas = [];
let assignment = [];
let nombresRevelados = false;

function agregarPersona() {
  const nombre = document.getElementById('nombreInput').value.trim();
  const genero = document.getElementById('generoSelect').value;
  if (!nombre) { alert('Ingresa un nombre'); return; }
  if (personas.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())) { alert('Este nombre ya existe'); return; }
  personas.push({ nombre, genero });
  document.getElementById('nombreInput').value = '';
  document.getElementById('nombreInput').focus();
  renderPersonas();
}

function removerPersona(i) {
  personas.splice(i, 1);
  renderPersonas();
}

function renderPersonas() {
  const list = document.getElementById('personList');
  document.getElementById('totalCount').textContent = personas.length;
  const H = personas.filter(p => p.genero === 'hombre').length;
  const M = personas.filter(p => p.genero === 'mujer').length;
  const diff = Math.abs(H - M);
  const warn = document.getElementById('warning');
  if (diff > 4 && H > 0 && M > 0) {
    warn.textContent = `⚠️ Hay ${diff} persona(s) de diferencia. Se generarán ${diff} excepciones mínimas.`;
    warn.classList.add('active');
  } else {
    warn.classList.remove('active');
  }
  list.innerHTML = personas.map((p, i) => `
    <li><span>${p.nombre} <span class="badge-${p.genero}">${p.genero}</span></span><button class="remove" onclick="removerPersona(${i})">✕</button></li>
  `).join('');
}

function importarLista() {
  const texto = document.getElementById('listaInput').value.trim();
  if (!texto) { alert('Pega la lista primero'); return; }
  const lines = texto.split(/[,\n]/);
  let added = 0;
  lines.forEach(item => {
    const trimmed = item.trim();
    if (!trimmed) return;
    const match = trimmed.match(/^(.+?)\s*\(\s*(h|m|hombre|mujer)\s*\)$/i);
    let nombre, g;
    if (match) {
      nombre = match[1].trim();
      const gen = match[2].toLowerCase();
      g = (gen === 'm' || gen === 'mujer') ? 'mujer' : 'hombre';
    } else {
      nombre = trimmed.replace(/[()]/g, '').trim();
      if (!nombre) return;
      g = 'hombre';
    }
    if (nombre && !personas.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
      personas.push({ nombre, genero: g });
      added++;
    }
  });
  if (added > 0) {
    renderPersonas();
    document.getElementById('listaInput').value = '';
    alert(`Se agregaron ${added} persona(s)`);
  } else {
    alert('No se encontraron nombres válidos. Usa formato: Nombre (h) o Nombre (m)');
  }
}

async function generarSorteo() {
  if (personas.length < 3) { alert('Se necesitan al menos 3 personas'); return; }
  if (personas.filter(p => p.genero === 'hombre').length === 0 || personas.filter(p => p.genero === 'mujer').length === 0) {
    alert('Se necesitan al menos 1 hombre y 1 mujer'); return;
  }
  try {
    const res = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ people: personas })
    });
    const data = await res.json();
    if (!data.success) { alert(data.error); return; }

    const genRes = await fetch('/api/generate', { method: 'POST' });
    const genData = await genRes.json();
    assignment = genData.assignment;

    document.getElementById('setupMode').style.display = 'none';
    document.getElementById('shareMode').classList.add('active');

    const link = window.location.href.split('?')[0];
    document.getElementById('shareLink').textContent = link;
    document.getElementById('shareLink').href = link;

  } catch (e) {
    alert('Error al generar sorteo: ' + e.message);
  }
}

async function revelar() {
  const nombre = document.getElementById('revealInput').value.trim();
  if (!nombre) { alert('Escribe tu nombre'); return; }
  try {
    const res = await fetch('/api/reveal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre })
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    const box = document.getElementById('revealResult');
    box.innerHTML = `
      <div class="secret-box">
        <div class="gift-icon">🎁</div>
        <p style="margin-top:12px;">Tu asignación es:</p>
        <div class="receiver-name">${data.daA}</div>
        ${data.esExcepcion ? '<p style="margin-top:8px;"><span class="badge-exception">⚠️ Excepción (hombre-hombre)</span></p>' : ''}
      </div>
    `;
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function toggleAdminView() {
  const adminView = document.getElementById('adminView');
  if (adminView.classList.contains('tab-view')) {
    adminView.classList.remove('tab-view');
    try {
      const res = await fetch('/api/asignacion');
      const data = await res.json();
      const assignment = data.assignment;
      let html = '<div class="section-title">📋 Lista completa de asignaciones</div>';
      assignment.forEach(a => {
        const exc = a.genero === participants.find(p => p.nombre === a.daAM)?.genero;
        const receiverGen = assignment.find(x => x.nombre === a.daAM)?.genero || '';
        html += `<div class="result-item"><span>${a.nombre} <span class="${a.genero==='hombre'?'badge-hombre':'badge-mujer'}">${a.genero}</span></span><span class="hidden-names" id="admin-receiver-${a.nombre}">→ <strong>${a.daAM}</strong> <span class="${receiverGen==='hombre'?'badge-hombre':'badge-mujer'}">${receiverGen}</span> ${exc?'<span class="badge-exception">⚠️</span>':''}</span></div>`;
      });
      adminView.innerHTML = html;
    } catch(e) {
      adminView.innerHTML = '<p>Error al cargar</p>';
    }
  } else {
    adminView.classList.add('tab-view');
  }
}
}

async function copiarLink() {
  const link = document.getElementById('shareLink').textContent;
  try {
    await navigator.clipboard.writeText(link);
    alert('Link copiado al portapapeles 📋');
  } catch {
    prompt('Copia este link:', link);
  }
}

function limpiarTodo() {
  personas = [];
  assignment = [];
  nombresRevelados = false;
  document.getElementById('personList').innerHTML = '';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('warning').classList.remove('active');
  document.getElementById('revealResult').innerHTML = '';
  document.getElementById('adminView').classList.add('tab-view');
  document.getElementById('setupMode').style.display = 'block';
  document.getElementById('shareMode').classList.remove('active');
  document.getElementById('revealInput').value = '';
}

document.getElementById('nombreInput').addEventListener('keypress', e => { if (e.key === 'Enter') agregarPersona(); });
document.getElementById('revealInput').addEventListener('keypress', e => { if (e.key === 'Enter') revelar(); });
</script>
</body>
</html>
